<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório Levantamento GPS</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="manifest" href="manifest.json">
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 10px; 
            background: linear-gradient(135deg, #e0e4e8 0%, #bdc3c7 50%, #9099a2 100%);
            min-height: 100vh;
            box-sizing: border-box;
        }
        .form-container { max-width: 550px; margin: auto; background: white; padding: 15px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h3 { text-align: center; margin: 0 0 15px 0; color: #1b4d3e; border-bottom: 2px solid #1b4d3e; padding-bottom: 5px; }
        .row { display: flex; gap: 8px; margin-bottom: 10px; }
        .col { flex: 1; display: flex; flex-direction: column; }
        label { font-size: 12px; font-weight: bold; margin-bottom: 3px; color: #444; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        canvas { border: 2px dashed #999; background: #fafafa; width: 100%; height: 200px; touch-action: none; }
        .btn { background: #1b4d3e; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-size: 15px; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-gps { background: #0275d8; padding: 6px; font-size: 12px; margin-top: 4px; }
        .preview-img { max-width: 60px; height: 60px; object-fit: cover; margin-top: 5px; border-radius: 4px; }
        /* Área de clique no formulário */
        .preview-canvas-box { border: 2px dashed #999; background: #fafafa; width: 100%; height: 150px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 4px; overflow: hidden; position: relative; }
        .preview-canvas-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .preview-hint { position: absolute; color: #666; font-size: 12px; background: rgba(255,255,255,0.8); padding: 4px 8px; border-radius: 4px; pointer-events: none; }
        /* Configuração da Tela Cheia do Desenho */
        .fullscreen-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: white; z-index: 10000; flex-direction: column; }
        #canvas { flex: 1; background: #fafafa; touch-action: none; width: 100vw; }
        .canvas-bar { display: flex; justify-content: space-between; background: #1b4d3e; padding: 10px; gap: 10px; }
        .btn-cv { flex: 1; padding: 12px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        /* Estilo do Cabeçalho com Logos e Bloco Central */
        .header-block {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            padding: 5px 0;
            width: 100%;
            gap: 10px;
        }
        .header-block .logo-side {
            flex: 1;
            display: flex;
            align-items: center;
            margin: 0 15px 0 15px;
        }
        .header-block .logo-side.left {
            justify-content: flex-start;
        }
        .header-block .logo-side.right {
            justify-content: flex-end;
        }
        .header-block .logo-side img {
            max-height: 100px;
            width: auto;
            max-width: 100%;
            object-fit: contain;
        }
        .header-block .header-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
        }
        .header-block .header-center img.logo-center {
            max-height: 80px;
            width: auto;
            object-fit: contain;
            margin-bottom: 0px;
            display: block;
        }
        .header-block .header-center h3 {
            margin: 0;
            padding: 2px 0;
            border: none;
            font-size: 15px;
            text-align: center;
            color: #1b4d3e;
            line-height: 1.1;
        }
    </style>
</head>
<body>
<div class="form-container">
    <div class="header-block">
        <div class="logo-side left">
            <img src="dsg.png" alt="DSG">
        </div>
        <div class="header-center">
            <img src="logo.png" alt="Logo" class="logo-center">
            <h3>Relatório<br>Levantamento GPS</h3>
        </div>
        <div class="logo-side right">
            <img src="3cgeo.png" alt="3ª CGEO">
        </div>
    </div>
    <div class="row" style="align-items: flex-end;">
        <div class="col" style="flex:1.2;"><label>Nome do Operador:</label><input type="text" id="operador"></div>
        <div class="col" style="flex:1;">
            <label>Identificação do Ponto:</label>
            <div id="pontoFormatadoBadge" style="padding: 8px 10px; background: #e2f0d9; color: #1b4d3e; font-weight: bold; font-size: 15px; border: 1px solid #b2d8b2; border-radius: 4px; text-align: center; height: 35px; box-sizing: border-box; display: flex; align-items: center; justify-content: center;">
                -
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col" style="flex:1;"><label>Sigla:</label><input type="text" id="pontoSigla" placeholder="Ex: PT"></div>
        <div class="col" style="flex:2;"><label>Tipo:</label>
            <select id="pontoTipo">
                <option value="H">H (Horizontal)</option>
                <option value="V">V (Vertical)</option>
                <option value="HV">HV (Horizontal e Vertical)</option>
            </select>
        </div>
        <div class="col" style="flex:1;"><label>Nº Ordem:</label><input type="text" id="pontoOrdem" placeholder="Ex: 001"></div>
    </div>
    <div class="row">
        <div class="col"><label>Altura Antena (cm):</label><input type="number" step="any" min="0" id="antena" inputmode="decimal" placeholder="Ex: 150"></div>
        <div class="col"><label>Altura Detalhe (cm):</label><input type="number" step="any" min="0" id="detalhe" inputmode="decimal" placeholder="Ex: 0"></div>
    </div>
    <div class="row">
        <div class="col"><label>Base:</label><input type="text" id="base"></div>
        <div class="col"><label>GPS:</label><input type="text" id="gps"></div>
    </div>
    <div class="row">
        <div class="col"><label>Data:</label><input type="date" id="data"></div>
        <div class="col"><label>Início:</label><input type="time" id="inicio"></div>
        <div class="col"><label>Fim:</label><input type="time" id="fim"></div>
    </div>
    <div class="row" style="align-items: flex-end;">
        <div class="col" style="flex:2;">
            <label>Coordenada Geográfica Aproximada:</label>
            <input type="text" id="coordGeo" placeholder="Capturando localização GPS automaticamente...">
        </div>
        <div class="col" style="flex:1;">
            <button type="button" class="btn btn-gps" onclick="pegarGPS(false)" style="margin-top:0; height:35px; white-space:nowrap;">📍 Recapturar GPS</button>
        </div>
    </div>
    <div class="row">
        <div class="col">
            <label>Endereço:</label>
            <textarea id="endereco" rows="2" placeholder="Endereço obtido via GPS ou digite aqui"></textarea>
        </div>
    </div>
    <div class="row"><div class="col"><label>Descrição:</label><textarea id="descricao" rows="2"></textarea></div></div>
    <div class="row"><div class="col"><label>Fotos (Até 5):</label><input type="file" id="fotos" accept="image/*" multiple><div id="previa"></div></div></div>
    
    <!-- Novo Bloco do Croqui (Início) -->
    <div class="row">
        <div class="col">
            <label>Croqui:</label>
            <div class="preview-canvas-box" onclick="abrirCroquiTelaCheia()">
                <span class="preview-hint" id="hintTexto">👉 Clique para Desenhar em Tela Cheia</span>
                <img id="imgPreviaCroqui" style="display:none;">
            </div>
        </div>
    </div>
    
    <div id="overlayCroqui" class="fullscreen-overlay">
        <div class="canvas-bar">
            <button type="button" class="btn-cv" onclick="fecharCroquiSemSalvar()" style="background:#d9534f; color:white;">❌ Cancelar</button>
            <button type="button" class="btn-cv" onclick="limparDesenho()" style="background:#f0ad4e; color:white;">🗑️ Limpar</button>
            <button type="button" class="btn-cv" onclick="salvarCroquiTelaCheia()" style="background:#5cb85c; color:white;">✔️ Confirmar</button>
        </div>
        <canvas id="canvas"></canvas>
    </div>
    <!-- Novo Bloco do Croqui (Fim) -->

    <button class="btn" onclick="salvarHTML()" style="background:#25D366;">💾 SALVAR</button>

    <footer style="text-align: center; margin-top: 15px; padding-top: 10px; border-top: 1px solid #ddd; font-size: 12px; word-break: break-all;">
        <a href="https://m4rc05-34t15t4.github.io/relatorio_levantamento" target="_blank" style="color: #1b4d3e; text-decoration: none; font-weight: bold;">© 2026 Relatório Levantamento GPS</a>
    </footer>

</div>
<script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('service-worker.js'); }
    let imgsB64 = [];
    const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    let pintando = false;

    const overlay = document.getElementById('overlayCroqui');
    let croquiSalvoB64 = "";

    const STORAGE_KEY = 'ultimo_ponto_coletado';

    function obterPontoFormatado() {
        const sigla = (document.getElementById('pontoSigla')?.value || '').trim();
        const tipo = (document.getElementById('pontoTipo')?.value || '').trim();
        const ordem = (document.getElementById('pontoOrdem')?.value || '').trim();
        const partes = [];
        if (sigla) partes.push(sigla);
        if (tipo) partes.push(tipo);
        if (ordem) partes.push(ordem);
        return partes.join('-') || 'S_N';
    }

    function atualizarPontoFormatado() {
        const formatted = obterPontoFormatado();
        const badge = document.getElementById('pontoFormatadoBadge');
        if (badge) {
            badge.innerText = formatted === 'S_N' ? '-' : formatted;
        }
    }

    function salvarUltimoPonto() {
        atualizarPontoFormatado();
        const dados = {
            operador: document.getElementById('operador')?.value || '',
            pontoSigla: document.getElementById('pontoSigla')?.value || '',
            pontoTipo: document.getElementById('pontoTipo')?.value || '',
            pontoOrdem: document.getElementById('pontoOrdem')?.value || '',
            antena: document.getElementById('antena')?.value || '',
            detalhe: document.getElementById('detalhe')?.value || '',
            base: document.getElementById('base')?.value || '',
            gps: document.getElementById('gps')?.value || '',
            data: document.getElementById('data')?.value || '',
            inicio: document.getElementById('inicio')?.value || '',
            fim: document.getElementById('fim')?.value || '',
            coordGeo: document.getElementById('coordGeo')?.value || '',
            endereco: document.getElementById('endereco')?.value || '',
            descricao: document.getElementById('descricao')?.value || ''
        };
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(dados));
        } catch (e) {
            console.error("Erro ao salvar no localStorage", e);
        }
    }

    function carregarUltimoPonto() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return;
            const dados = JSON.parse(raw);
            if (!dados) return;

            const campos = ['operador', 'pontoSigla', 'pontoTipo', 'pontoOrdem', 'antena', 'detalhe', 'base', 'gps', 'data', 'inicio', 'fim', 'coordGeo', 'endereco', 'descricao'];
            campos.forEach(id => {
                const el = document.getElementById(id);
                if (el && dados[id] !== undefined) {
                    el.value = dados[id];
                }
            });

            if (dados.ponto && !dados.pontoSigla) {
                const partes = dados.ponto.split('-');
                if (partes.length === 3) {
                    if (document.getElementById('pontoSigla')) document.getElementById('pontoSigla').value = partes[0];
                    if (document.getElementById('pontoTipo')) document.getElementById('pontoTipo').value = partes[1];
                    if (document.getElementById('pontoOrdem')) document.getElementById('pontoOrdem').value = partes[2];
                }
            }

            atualizarPontoFormatado();
        } catch (e) {
            console.error("Erro ao carregar do localStorage", e);
        }
    }

    function aplicarRestricaoNumerica(id) {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('keydown', e => {
            if (['Backspace', 'Tab', 'Delete', 'ArrowLeft', 'ArrowRight', 'Home', 'End', '.', ','].includes(e.key) || e.ctrlKey || e.metaKey) {
                return;
            }
            if (!/^[0-9]$/.test(e.key)) {
                e.preventDefault();
            }
        });
        el.addEventListener('input', e => {
            el.value = el.value.replace(/[^0-9.,]/g, '');
        });
    }

    function abrirCroquiTelaCheia() {
        overlay.style.display = 'flex';
        setTimeout(() => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 60;
            ctx.lineWidth = 3;
            ctx.lineCap = "round";
            ctx.strokeStyle = "#000000";
            
            if (croquiSalvoB64) {
                const img = new Image();
                img.onload = () => ctx.drawImage(img, 0, 0);
                img.src = croquiSalvoB64;
            }
        }, 50);
    }

    function fecharCroquiSemSalvar() { overlay.style.display = 'none'; }
    function limparDesenho() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    function salvarCroquiTelaCheia() {
        croquiSalvoB64 = canvas.toDataURL('image/png');
        const imgPrevia = document.getElementById('imgPreviaCroqui');
        imgPrevia.src = croquiSalvoB64;
        imgPrevia.style.display = 'block';
        document.getElementById('hintTexto').style.display = 'none';
        overlay.style.display = 'none';
    }

    document.getElementById('fotos').addEventListener('change', e => {
        const files = Array.from(e.target.files).slice(0, 5);
        document.getElementById('previa').innerHTML = ""; imgsB64 = [];
        files.forEach(f => {
            const r = new FileReader();
            r.onload = ev => {
                imgsB64.push(ev.target.result);
                const i = document.createElement('img'); i.src = ev.target.result; i.className="preview-img";
                document.getElementById('previa').appendChild(i);
            };
            r.readAsDataURL(f);
        });
    });

    function pegarGPS(silencioso = false) {
        if (!navigator.geolocation) {
            if (!silencioso) alert("Sem suporte a GPS");
            return;
        }
        const inputGeo = document.getElementById('coordGeo');
        const inputEndereco = document.getElementById('endereco');

        if (!inputGeo.value) {
            inputGeo.placeholder = "Buscando localização GPS...";
        }

        navigator.geolocation.getCurrentPosition(async p => {
            const lat = p.coords.latitude;
            const lon = p.coords.longitude;
            inputGeo.value = `${lat}, ${lon}`;
            salvarUltimoPonto();

            if (navigator.onLine) {
                if (!inputEndereco.value) {
                    inputEndereco.placeholder = "Buscando endereço via internet...";
                }
                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);
                    if (response.ok) {
                        const data = await response.json();
                        if (data && data.display_name) {
                            inputEndereco.value = data.display_name;
                            salvarUltimoPonto();
                        }
                    }
                } catch (err) {
                    console.log("Falha ou offline ao buscar endereço:", err);
                } finally {
                    inputEndereco.placeholder = "Endereço obtido via GPS ou digite aqui";
                }
            }
        }, err => {
            console.log("Erro/recusa de GPS:", err);
            if (!silencioso) alert("Erro ao ler GPS. Verifique as permissões de localização.");
        }, { enableHighAccuracy: true, timeout: 15000 });
    }

    function resCanvas() { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; ctx.lineWidth = 2; ctx.lineCap = "round"; }

    window.addEventListener('load', () => {
        carregarUltimoPonto();

        // Preenche Data e Hora de Início com a data/hora atual se não estiverem preenchidos
        const hoje = new Date();
        const ano = hoje.getFullYear();
        const mes = String(hoje.getMonth() + 1).padStart(2, '0');
        const dia = String(hoje.getDate()).padStart(2, '0');
        const hora = String(hoje.getHours()).padStart(2, '0');
        const minuto = String(hoje.getMinutes()).padStart(2, '0');

        const inputData = document.getElementById('data');
        if (inputData && !inputData.value) {
            inputData.value = `${ano}-${mes}-${dia}`;
        }

        const inputInicio = document.getElementById('inicio');
        if (inputInicio && !inputInicio.value) {
            inputInicio.value = `${hora}:${minuto}`;
        }

        aplicarRestricaoNumerica('antena');
        aplicarRestricaoNumerica('detalhe');
        resCanvas();

        const campos = ['operador', 'pontoSigla', 'pontoTipo', 'pontoOrdem', 'antena', 'detalhe', 'base', 'gps', 'data', 'inicio', 'fim', 'coordGeo', 'endereco', 'descricao'];
        campos.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('input', salvarUltimoPonto);
                el.addEventListener('change', salvarUltimoPonto);
            }
        });

        // Captura GPS automaticamente ao carregar apenas se não tiver coordenada salva e se a permissão já estiver concedida
        const inputGeoVal = document.getElementById('coordGeo')?.value;
        if (!inputGeoVal) {
            if (navigator.permissions && navigator.permissions.query) {
                navigator.permissions.query({ name: 'geolocation' }).then(result => {
                    if (result.state === 'granted') {
                        pegarGPS(true);
                    }
                }).catch(() => {
                    // Fallback para navegadores que não suportam a consulta de permissão
                });
            }
        }
    });

    window.addEventListener('resize', resCanvas);

    function xy(e) {
        const r = canvas.getBoundingClientRect();
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: cx - r.left, y: cy - r.top };
    }
    function tIni(e) { pintando = true; const p = xy(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
    function tMov(e) { if (!pintando) return; if(e.touches) e.preventDefault(); const p = xy(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }

    canvas.addEventListener('touchstart', tIni); canvas.addEventListener('touchmove', tMov); canvas.addEventListener('touchend', () => pintando = false);
    canvas.addEventListener('mousedown', tIni); canvas.addEventListener('mousemove', tMov); canvas.addEventListener('mouseup', () => pintando = false);

    function salvarHTML() {
        salvarUltimoPonto();
        const idPt = obterPontoFormatado();
        const cGeo = document.getElementById('coordGeo').value;
        const endereco = document.getElementById('endereco').value;
        const dataHoraSalvamento = new Date().toLocaleString('pt-BR');
        let ftHtml = ""; imgsB64.forEach((im, idx) => { ftHtml += `<h3>Foto ${idx+1}</h3><img src="${im}" style="max-width:100%;"><br>`; });
        
        let mapLink = "<p>Sem coordenadas.</p>";
        if(cGeo && cGeo.includes(',')) {
            const arr = cGeo.split(',');
            mapLink = `<p><b>GPS:</b> ${cGeo}</p><a href="https://www.google.com/maps?q=${arr[0].trim()},${arr[1].trim()}" target="_blank" style="background:#0275d8;color:white;padding:10px;text-decoration:none;display:inline-block;border-radius:4px;">📍 Abrir no Google Maps</a>`;
        }

        const antenaVal = document.getElementById('antena').value;
        const detalheVal = document.getElementById('detalhe').value;

        const m = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Relatório Levantamento GPS</title><style>body{font-family:Arial;margin:20px;color:#222;}.box{border:1px solid #ccc;padding:10px;margin-bottom:10px;background:#f9f9f9;}</style></head><body><h2>📋 Relatório Levantamento GPS</h2><div class="box"><b>Operador:</b> ${document.getElementById('operador').value}<br><b>Ponto:</b> ${idPt}<br><b>Endereço:</b> ${endereco}<br><b>Data/Hora do Salvamento:</b> ${dataHoraSalvamento}</div><div class="box"><b>Altura Antena:</b> ${antenaVal ? antenaVal + ' cm' : ''}<br><b>Altura Detalhe:</b> ${detalheVal ? detalheVal + ' cm' : ''}<br><b>Base:</b> ${document.getElementById('base').value}<br><b>Aparelho GPS:</b> ${document.getElementById('gps').value}<br><b>Data/Hora da Coleta:</b> ${document.getElementById('data').value} (${document.getElementById('inicio').value} ate ${document.getElementById('fim').value})</div><div class="box">${mapLink}</div><div class="box"><b>Descrição:</b><br>${document.getElementById('descricao').value.replace(/\n/g, '<br>')}</div><div class="box" style="text-align:center;"><h3>📐 Croqui</h3><img src="${croquiSalvoB64 || canvas.toDataURL('image/png')}" style="background:white;border:1px solid #999;"></div><div class="box" style="text-align:center;">${ftHtml}</div><div class="box" style="text-align:center; font-size:12px;"><a href="https://m4rc05-34t15t4.github.io/relatorio_levantamento" target="_blank" style="color:#1b4d3e; text-decoration:none; font-weight:bold;">https://m4rc05-34t15t4.github.io/relatorio_levantamento</a></div></body></html>`;

        const blob = new Blob([m], { type: "text/html" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Ponto_${idPt}.html`;
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }
</script>
</body>
</html>
